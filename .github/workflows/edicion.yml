# Arma una edición nueva de Sorbo cada 30 minutos y la publica.
name: Edición de Sorbo

on:
  schedule:
    - cron: "7,37 * * * *"     # cada 30 minutos (minuto 7 y 37, para evitar la hora punta de GitHub)
  workflow_dispatch:            # botón "Run workflow" para armarla a mano
  push:
    branches: [main]
    paths: ["news/**", "build.py"]

permissions:
  contents: write

concurrency:
  group: edicion
  cancel-in-progress: false

jobs:
  edicion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install certifi
      - run: python tests/test_news.py
      - run: python build.py
      - name: Guardar la edición
        run: |
          git config user.name "sorbo-bot"
          git config user.email "sorbo-bot@users.noreply.github.com"
          git add docs/data/edition.json
          git diff --staged --quiet || git commit -m "Edición $(TZ=America/Santiago date '+%d-%m %H:%M')"
          git pull --rebase --autostash
          git push
